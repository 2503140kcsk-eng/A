name: Lean formal verification

on:
  push:
    branches:
      - main
      - "research/**"
    paths:
      - "**/*.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lean.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.lean"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Build Lean proofs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lean and build Mathlib project
        uses: leanprover/lean-action@v1
        with:
          build-args: "--wfail"
